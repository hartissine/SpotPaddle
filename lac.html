<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="application-name" content="Spot Paddle">
    <meta name="apple-mobile-web-app-title" content="Spot Paddle">
    <meta name="description" content="Page lac Spot Paddle" />
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spot Paddle - Détails Lac" />
    <meta property="og:description" content="Informations complètes du lac avec Paddle Score™" />
    <meta property="og:image" content="https://spotpaddle.ca/assets/spotpaddle-social.jpg" />
    <meta property="og:image:secure_url" content="https://spotpaddle.ca/assets/spotpaddle-social.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Spot Paddle au Québec" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:url" content="https://spotpaddle.ca/lac.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spot Paddle - Détails Lac" />
    <meta name="twitter:description" content="Informations complètes du lac avec Paddle Score™" />
    <meta name="twitter:image" content="https://spotpaddle.ca/assets/spotpaddle-social.jpg" />
    <meta name="twitter:image:alt" content="Spot Paddle au Québec" />
    <link rel="canonical" href="https://spotpaddle.ca/lac.html" />
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/spotpaddle-icon-192.png">
    <link rel="apple-touch-icon" href="/assets/icons/spotpaddle-icon-192.png">
    <link rel="preconnect" href="https://meteo.spotpaddle.ca">
    <link rel="dns-prefetch" href="//meteo.spotpaddle.ca">

    <title>Spot Paddle - Détails Lac</title>
    <link rel="stylesheet" href="assets/tailwind.css?v=20260718-1" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=20260629-1" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans dark:bg-slate-900 dark:text-slate-100 transition-colors">

    <nav class="p-4 flex flex-wrap justify-between items-center bg-gradient-to-r from-blue-600 to-blue-800 shadow-lg sticky top-0 z-[2000] backdrop-blur-md">
        <a href="index.html" class="text-2xl font-bold text-white flex items-center gap-2">
            <span class="text-3xl">🚣</span> Spot Paddle
        </a>
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-white hover:text-blue-200 transition text-sm font-medium">← Retour</a>
            <button id="themeToggle" onclick="toggleTheme()" class="bg-white/20 text-white border border-white/30 px-3 py-2 rounded-full font-medium text-sm shadow-sm hover:bg-white/30 transition">
                🌙
            </button>
        </div>
    </nav>

    <div id="loading" class="fixed inset-0 bg-white dark:bg-slate-900 flex justify-center items-center h-screen z-[9999]">
        <div class="text-center">
            <div class="text-6xl mb-4 animate-bounce">⏳</div>
            <p class="text-slate-600 dark:text-slate-400 font-medium">Chargement des informations du lac...</p>
        </div>
    </div>

    <div id="lakeContainer" class="w-full"></div>

    <div id="photoModal" class="hidden fixed inset-0 bg-black/90 z-[5000] flex items-center justify-center p-4">
        <button onclick="closePhotoModal()" class="absolute top-4 right-4 text-white text-4xl hover:scale-110 transition">×</button>
        <img id="modalImage" src="" alt="" class="max-w-4xl max-h-[80vh] rounded-lg shadow-2xl">
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 text-white text-sm bg-black/50 px-4 py-2 rounded-full backdrop-blur">
            <span id="photoCount">1/3</span>
        </div>
    </div>

    <div id="nearbyLakesSection" class="hidden fixed bottom-4 right-4 z-[1000] w-[calc(100vw-2rem)] max-w-sm sm:bottom-6 sm:right-6">
        <div id="nearbyLakesPanel" class="rounded-2xl border-l-4 border-blue-600 bg-white p-5 shadow-2xl dark:bg-slate-800 sm:p-6" role="region" aria-label="Lacs proches">
            <div class="mb-4 flex items-center justify-between gap-4">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">🗺️ Lacs Proches</h3>
                <button type="button" onclick="setNearbyLakesExpanded(false)" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-slate-100 text-xl font-bold text-slate-600 transition hover:bg-blue-100 hover:text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600" aria-label="Réduire les suggestions de lacs" title="Réduire">
                    <span aria-hidden="true">−</span>
                </button>
            </div>
            <div id="nearbyLakesList" class="space-y-3"></div>
        </div>
        <button id="nearbyLakesBubble" type="button" onclick="setNearbyLakesExpanded(true)" class="relative ml-auto hidden flex h-14 w-14 items-center justify-center rounded-full bg-blue-600 text-2xl text-white shadow-2xl transition hover:scale-105 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800" aria-label="Afficher les lacs proches" aria-controls="nearbyLakesPanel" aria-expanded="false" title="Afficher les lacs proches">
            <span aria-hidden="true">🗺️</span>
            <span id="nearbyLakesCount" class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-emerald-500 px-1 text-[11px] font-bold text-white ring-2 ring-white dark:ring-slate-900">2</span>
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data.js?v=20260709-1"></script>
    <script id="lakeStructuredData" type="application/ld+json"></script>
    <script>
        // ========== GESTION DU THÈME ==========
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        const SITE_ORIGIN = 'https://spotpaddle.ca';
        const FALLBACK_SOCIAL_IMAGE = `${SITE_ORIGIN}/assets/spotpaddle-social.jpg`;

        function toAbsoluteSiteUrl(value, fallback = FALLBACK_SOCIAL_IMAGE) {
            if (!value) return fallback;

            try {
                return new URL(value, `${SITE_ORIGIN}/`).toString();
            } catch (error) {
                return fallback;
            }
        }

        function setMetaContent(selector, content) {
            const meta = document.querySelector(selector);
            if (meta && content) {
                meta.setAttribute('content', content);
            }
        }

        function setLakeStructuredData(currentLake, canonicalUrl, imageUrl) {
            const structuredDataEl = document.getElementById('lakeStructuredData');
            if (!structuredDataEl) return;

            const structuredData = {
                '@context': 'https://schema.org',
                '@type': 'Place',
                name: `${currentLake.name} - Spot Paddle`,
                description: currentLake.description || currentLake.longDescription || '',
                url: canonicalUrl,
                image: imageUrl,
                address: {
                    '@type': 'PostalAddress',
                    addressRegion: currentLake.region || 'Québec',
                    addressCountry: 'CA'
                },
                geo: {
                    '@type': 'GeoCoordinates',
                    latitude: currentLake.lat,
                    longitude: currentLake.lon
                },
                amenityFeature: [
                    {
                        '@type': 'LocationFeatureSpecification',
                        name: 'Paddle Score',
                        value: currentLake.paddleScore || null
                    },
                    {
                        '@type': 'LocationFeatureSpecification',
                        name: 'Acces gratuit',
                        value: currentLake.isFree === true
                    }
                ]
            };

            structuredDataEl.textContent = JSON.stringify(structuredData);
        }

        // Vérifier que data.js a chargé au chargement de la fenêtre
        window.addEventListener('load', () => {
            if (typeof lacDatabase === 'undefined') {
                console.error('ERROR: lacDatabase not loaded - data.js missing?');
                showErrorMessage('Erreur de chargement', 'Impossible de charger les données. Vérifiez que data.js existe dans le dossier.');
            }
        });

        // Fonction d'erreur globale
        function showErrorMessage(title, message) {
            document.getElementById('lakeContainer').innerHTML = `
                <div class="max-w-6xl mx-auto px-6 py-16 text-center">
                    <div class="text-6xl mb-4">⚠️</div>
                    <h1 class="text-3xl font-bold mb-2">${title}</h1>
                    <p class="text-slate-600 dark:text-slate-400 mb-6">${message}</p>
                    <a href="index.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-bold transition">Retour à l'accueil</a>
                </div>
            `;
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.style.display = 'none';
        }

        // ========== FETCH MÉTÉO AVEC TIMEOUT ==========
        async function fetchWeatherForLake(lat, lon) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6000);

            try {
                const params = new URLSearchParams({ lat: String(lat), lon: String(lon) });
                const response = await fetch(`https://meteo.spotpaddle.ca/meteo.php?${params.toString()}`, {
                    signal: controller.signal,
                    cache: 'default'
                });
                
                if (!response.ok) throw new Error('API status: ' + response.status);
                
                const data = await response.json();
                if (!data?.main || !data?.wind || !data?.clouds) {
                    throw new Error('Réponse météo incomplète');
                }
                const windKmh = data.wind.speed * 3.6;
                return {
                    available: true,
                    temp: data.main.temp,
                    wind: windKmh, // m/s à km/h
                    clouds: data.clouds.all,
                    waterState: getLakeWaterState(windKmh)
                };
            } catch (e) {
                console.warn('Météo indisponible:', e.message);
                return { available: false, temp: null, wind: null, clouds: null, waterState: 'Indisponible' };
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function formatLakeWeather(value, digits, suffix) {
            return Number.isFinite(value) ? `${value.toFixed(digits)}${suffix}` : 'Indisponible';
        }

        // État qualitatif inspiré de l'échelle de Beaufort. Une vitesse de vent
        // seule ne permet pas de calculer une hauteur de vague fiable sur un lac.
        function getLakeWaterState(windKmh) {
            if (!Number.isFinite(windKmh)) return 'Indisponible';
            if (windKmh < 1) return 'Calme';
            if (windKmh < 6) return 'Rides légères';
            if (windKmh < 12) return 'Vaguelettes';
            if (windKmh < 20) return 'Très petites vagues';
            if (windKmh < 29) return 'Petites vagues';
            if (windKmh < 39) return 'Agité · moutons';
            return 'Très agité';
        }

        function updateLakeWeatherWidget(weatherData) {
            const status = document.getElementById('lakeWeatherStatus');
            const temperature = document.getElementById('lakeWeatherTemp');
            const wind = document.getElementById('lakeWeatherWind');
            const clouds = document.getElementById('lakeWeatherClouds');
            const waves = document.getElementById('lakeWeatherWaves');

            if (!status || !temperature || !wind || !clouds || !waves) return;

            if (weatherData.available) {
                status.className = 'mb-4 rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-sm font-semibold text-emerald-800 dark:border-emerald-900/50 dark:bg-emerald-950/30 dark:text-emerald-200';
                status.textContent = 'Conditions météo mises à jour.';
            } else {
                status.className = 'mb-4 rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm font-semibold text-amber-800 dark:border-amber-900/50 dark:bg-amber-950/30 dark:text-amber-200';
                status.textContent = 'Météo temporairement indisponible. La fiche du spot reste accessible.';
            }

            temperature.textContent = formatLakeWeather(weatherData.temp, 1, '°C');
            wind.textContent = formatLakeWeather(weatherData.wind, 1, ' km/h');
            clouds.textContent = formatLakeWeather(weatherData.clouds, 0, '%');
            waves.textContent = weatherData.waterState || 'Indisponible';
        }

        async function loadLakeWeather(currentLake) {
            const weatherData = await fetchWeatherForLake(currentLake.lat, currentLake.lon);
            updateLakeWeatherWidget(weatherData);
        }

        // ========== INITIALISATION PAGE ==========
        const urlParams = new URLSearchParams(window.location.search);
        const lakeSlug = urlParams.get('lake');

        if (typeof lacDatabase === 'undefined') {
            console.error('❌ lacDatabase non défini.');
        } else {
            const currentLake = lacDatabase.find(l => l.slug === lakeSlug);

            if (!currentLake) {
                showErrorMessage('Lac non trouvé', "Désolé, ce lac n'existe pas ou a été déplacé.");
            } else {
                // Métadonnées dynamiques
                const canonicalUrl = `https://spotpaddle.ca/lac.html?lake=${encodeURIComponent(currentLake.slug)}`;
                const imageUrl = toAbsoluteSiteUrl(currentLake.mainImage);
                const pageTitle = `${currentLake.name} - Spot Paddle`;
                const pageDescription = currentLake.description || currentLake.longDescription || 'Spot de paddle au Québec avec GPS, météo et informations pratiques.';

                document.title = pageTitle;
                setMetaContent('meta[property="og:title"]', pageTitle);
                setMetaContent('meta[property="og:description"]', pageDescription);
                setMetaContent('meta[property="og:image"]', imageUrl);
                setMetaContent('meta[property="og:image:secure_url"]', imageUrl);
                setMetaContent('meta[property="og:image:alt"]', currentLake.name);
                setMetaContent('meta[property="og:url"]', canonicalUrl);
                setMetaContent('meta[name="description"]', pageDescription);
                setMetaContent('meta[name="twitter:title"]', pageTitle);
                setMetaContent('meta[name="twitter:description"]', pageDescription);
                setMetaContent('meta[name="twitter:image"]', imageUrl);
                setMetaContent('meta[name="twitter:image:alt"]', currentLake.name);

                const canonicalLink = document.querySelector('link[rel="canonical"]');
                if (canonicalLink) canonicalLink.setAttribute('href', canonicalUrl);
                setLakeStructuredData(currentLake, canonicalUrl, imageUrl);

                // Lancement du rendu
                renderLakePage(currentLake);
            }
        }

        // ========== RENDU PRINCIPAL ==========
        function renderLakePage(currentLake) {
            try {
                const accessPoint = typeof getLakeAccessPoint === 'function'
                    ? getLakeAccessPoint(currentLake)
                    : { lat: currentLake.lat, lon: currentLake.lon, name: currentLake.access?.description || currentLake.name, confidence: 'needs_verification' };
                const parkingPoint = typeof getLakeParkingPoint === 'function'
                    ? getLakeParkingPoint(currentLake)
                    : null;
                const directionsPoint = typeof getLakeDirectionsPoint === 'function'
                    ? getLakeDirectionsPoint(currentLake)
                    : (parkingPoint || accessPoint);
                const directionsUrl = typeof getLakeDirectionsUrl === 'function'
                    ? getLakeDirectionsUrl(currentLake)
                    : `https://www.google.com/maps/dir/?api=1&destination=${directionsPoint.lat},${directionsPoint.lon}`;
                const gpsStatus = accessPoint?.confidence === 'high'
                    ? 'GPS accès validé'
                    : accessPoint?.confidence === 'medium'
                        ? 'GPS accès probable'
                        : 'GPS accès à vérifier';
                const parkingStatus = parkingPoint?.confidence === 'high'
                    ? 'GPS stationnement validé'
                    : parkingPoint?.confidence === 'medium'
                        ? 'GPS stationnement probable'
                        : 'GPS stationnement à vérifier';
                const gpsSource = accessPoint?.source || 'Coordonnées Spot Paddle existantes';
                
                // Sauvegarde globale de la galerie pour éviter les soucis d'échappement de chaînes HTML inline
                window.currentLakeGallery = currentLake.gallery || [];

                // Simuler des badges ou scores si non définis
                const score = currentLake.paddleScore || 85;
                let badgeEmoji = "🟢", badgeColor = "#10b981";
                if(score < 50) { badgeEmoji = "🔴"; badgeColor = "#ef4444"; }
                else if(score < 75) { badgeEmoji = "🟡"; badgeColor = "#f59e0b"; }

                const html = `
                    <section class="relative h-96 md:h-[60vh] flex items-end overflow-hidden">
                        <img src="${currentLake.mainImage}" alt="${currentLake.name}" decoding="async" fetchpriority="high" class="absolute inset-0 w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
                        
                        <div class="relative z-10 max-w-6xl mx-auto w-full px-6 pb-12">
                            <h1 class="text-4xl md:text-6xl font-black text-white mb-3 drop-shadow-md">${currentLake.name}</h1>
                            <p class="text-xl text-blue-200 mb-6 drop-shadow-sm">${currentLake.region} • ${currentLake.maxLength || 'Distance non renseignée'}</p>
                            
                            <div class="inline-flex items-center gap-3 bg-white/95 dark:bg-slate-900/95 backdrop-blur px-6 py-3 rounded-2xl font-bold shadow-xl">
                                <span class="text-4xl">${badgeEmoji}</span>
                                <div>
                                    <div class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider">Paddle Score™</div>
                                    <div class="text-2xl font-black" style="color: ${badgeColor}">${score}/100</div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <div class="max-w-6xl mx-auto px-6 py-12">
                        <div class="grid md:grid-cols-3 gap-8">
                            
                            <div class="md:col-span-2 space-y-12">
                                <section>
                                    <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">📖 À Propos</h2>
                                    <p class="text-base text-slate-700 dark:text-slate-300 leading-relaxed mb-6">
                                        ${currentLake.longDescription || currentLake.description || 'Pas de description détaillée disponible.'}
                                    </p>
                                    <div class="grid md:grid-cols-2 gap-4">
                                        ${(currentLake.highlights || ['Spot magnifique', 'Idéal en famille']).map(h => `
                                            <div class="bg-blue-50 dark:bg-blue-950/40 border-l-4 border-blue-500 p-4 rounded-r-xl font-medium text-slate-800 dark:text-slate-200">
                                                ${h}
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>

                                ${currentLake.gallery && currentLake.gallery.length > 0 ? `
                                <section>
                                    <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">📸 Galerie Photos</h2>
                                    <div class="grid grid-cols-3 gap-4">
                                        ${currentLake.gallery.map((img, idx) => `
                                            <img 
                                                src="${img}" 
                                                alt="Photo ${idx + 1}"
                                                loading="lazy"
                                                decoding="async"
                                                onclick="openPhotoModal(${idx}, ${currentLake.gallery.length}, window.currentLakeGallery)"
                                                class="w-full h-32 md:h-44 object-cover rounded-xl shadow-md hover:scale-105 transition cursor-pointer"
                                            >
                                        `).join('')}
                                    </div>
                                </section>` : ''}

                                <section>
                                    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
                                        <h2 class="text-2xl font-bold flex items-center gap-2">🗺️ Localisation</h2>
                                        <div id="detailMapModeControl" class="inline-flex items-center rounded-lg border border-slate-200 bg-white p-1 shadow-sm dark:border-slate-700 dark:bg-slate-900" role="group" aria-label="Type de carte">
                                            <button id="detailMapModeStreet" type="button" onclick="setDetailMapMode('street')" aria-pressed="true" class="min-h-9 rounded-md bg-blue-600 px-3 text-xs font-bold text-white transition-colors">Carte</button>
                                            <button id="detailMapModeSatellite" type="button" onclick="setDetailMapMode('satellite')" aria-pressed="false" class="min-h-9 rounded-md px-3 text-xs font-bold text-slate-600 transition-colors hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Satellite</button>
                                        </div>
                                    </div>
                                    <div class="relative">
                                        <div id="map" class="shadow-xl rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden" style="height: 350px;"></div>
                                        <button id="detailMapInteractionToggle" type="button" onclick="toggleDetailMapInteraction()" class="map-interaction-toggle" aria-pressed="false" hidden>
                                            🗺️ Explorer la carte
                                        </button>
                                        <div id="detailMapZoomControl" class="absolute bottom-4 right-4 z-[1000] overflow-hidden rounded-lg border-2 border-blue-600 bg-white/95 shadow-xl backdrop-blur-md dark:border-blue-500 dark:bg-slate-800" role="group" aria-label="Contrôles du zoom">
                                            <button type="button" onclick="zoomDetailMap(1)" class="flex h-11 w-11 items-center justify-center text-2xl font-bold text-blue-600 transition-colors hover:bg-blue-50 dark:text-blue-400 dark:hover:bg-slate-700" title="Zoom avant" aria-label="Zoom avant">+</button>
                                            <button type="button" onclick="zoomDetailMap(-1)" class="flex h-11 w-11 items-center justify-center border-t border-slate-200 text-2xl font-bold text-blue-600 transition-colors hover:bg-blue-50 dark:border-slate-700 dark:text-blue-400 dark:hover:bg-slate-700" title="Zoom arrière" aria-label="Zoom arrière">−</button>
                                        </div>
                                    </div>
                                </section>

                                <section>
                                    <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">🚗 Accès & Stationnement</h2>
                                    <div class="grid md:grid-cols-2 gap-6">
                                        <div class="bg-slate-100 dark:bg-slate-800/60 p-6 rounded-2xl border border-slate-200 dark:border-slate-700">
                                            <h3 class="text-lg font-bold mb-2 text-blue-600 dark:text-blue-400">📍 Point d'accès</h3>
                                            <p class="font-semibold text-sm text-slate-700 dark:text-slate-300 mb-2">${currentLake.access?.type || "Mise à l'eau publique"}</p>
                                            <p class="text-sm text-slate-600 dark:text-slate-400">${currentLake.access?.description || 'Accès direct via la plage principale.'}</p>
                                            <p class="text-xs text-slate-500 mt-3">${accessPoint?.name || 'Point GPS actuel'} (${gpsStatus})</p>
                                            ${accessPoint?.hideSource ? '' : `<p class="text-xs text-slate-500 mt-2">Source GPS: ${gpsSource}</p>`}
                                            <p class="text-xs text-slate-500 mt-2">La carte distingue la mise à l'eau du stationnement lorsqu'ils sont tous deux confirmés.</p>
                                            <p class="text-xs text-slate-500 mt-3">Difficulté d'accès: <span class="font-bold">${currentLake.access?.difficulty || 'Facile'}</span></p>
                                        </div>
                                        <div class="bg-slate-100 dark:bg-slate-800/60 p-6 rounded-2xl border border-slate-200 dark:border-slate-700">
                                            <h3 class="text-lg font-bold mb-2 text-green-600 dark:text-green-400">🅿️ Stationnement</h3>
                                            <p class="font-semibold text-sm text-slate-700 dark:text-slate-300 mb-1">${parkingPoint?.name || currentLake.parking?.location || 'Stationnement à confirmer'}</p>
                                            <p class="text-sm text-slate-600 dark:text-slate-400">${parkingStatus}</p>
                                            ${parkingPoint?.distanceToAccessMeters ? `<p class="text-xs text-slate-500 mt-3">Transport jusqu'à l'eau : environ <span class="font-bold">${parkingPoint.distanceToAccessMeters} m</span></p>` : '<p class="text-xs text-amber-700 dark:text-amber-300 mt-3">La proximité du stationnement avec l’eau reste à confirmer.</p>'}
                                            <p class="text-xs text-slate-500 mt-2">Tarif : <span class="font-bold">${parkingPoint?.fee || currentLake.parking?.cost || 'À vérifier'}</span></p>
                                            ${parkingPoint?.source && !parkingPoint?.hideSource ? `<p class="text-xs text-slate-500 mt-2">Source GPS : ${parkingPoint.source}</p>` : ''}
                                        </div>
                                    </div>
                                </section>

                                <section>
                                    <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">🌤️ Conditions Météo Live</h2>
                                    <div class="bg-gradient-to-br from-blue-50 to-sky-100 dark:from-slate-800 dark:to-slate-800/40 border border-blue-200 dark:border-slate-700 p-6 rounded-2xl shadow-sm">
                                        <div id="lakeWeatherStatus" class="mb-4 flex items-center gap-2 rounded-xl border border-blue-200 bg-blue-50 p-3 text-sm font-semibold text-blue-800 dark:border-blue-900/50 dark:bg-blue-950/30 dark:text-blue-200" role="status" aria-live="polite">
                                            <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-blue-500 border-t-transparent" aria-hidden="true"></span>
                                            Chargement de la météo en arrière-plan…
                                        </div>
                                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            <div class="text-center bg-white dark:bg-slate-900/60 p-3 rounded-xl shadow-sm">
                                                <div class="text-2xl mb-1">🌡️</div>
                                                <p class="text-xs text-slate-500">Température</p>
                                                <p id="lakeWeatherTemp" class="text-xl font-black">—</p>
                                            </div>
                                            <div class="text-center bg-white dark:bg-slate-900/60 p-3 rounded-xl shadow-sm">
                                                <div class="text-2xl mb-1">💨</div>
                                                <p class="text-xs text-slate-500">Vent</p>
                                                <p id="lakeWeatherWind" class="text-xl font-black">—</p>
                                            </div>
                                            <div class="text-center bg-white dark:bg-slate-900/60 p-3 rounded-xl shadow-sm">
                                                <div class="text-2xl mb-1">☁️</div>
                                                <p class="text-xs text-slate-500">Nuages</p>
                                                <p id="lakeWeatherClouds" class="text-xl font-black">—</p>
                                            </div>
                                            <div class="text-center bg-white dark:bg-slate-900/60 p-3 rounded-xl shadow-sm">
                                                <div class="text-2xl mb-1">🌊</div>
                                                <p class="text-xs text-slate-500">État de l’eau (vent)</p>
                                                <p id="lakeWeatherWaves" class="text-base font-black leading-tight">—</p>
                                            </div>
                                        </div>
                                        <p class="mt-3 text-xs text-slate-500 dark:text-slate-400">Estimation qualitative basée sur le vent; ce n’est pas une mesure de la hauteur des vagues.</p>
                                    </div>
                                </section>

                                ${currentLake.faq && currentLake.faq.length > 0 ? `
                                <section>
                                    <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">❓ Questions Fréquentes</h2>
                                    <div class="space-y-3">
                                        ${currentLake.faq.map(item => `
                                            <details class="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl group border border-slate-200 dark:border-slate-700">
                                                <summary class="font-bold cursor-pointer flex justify-between items-center text-sm md:text-base">
                                                    ${item.q}
                                                    <span class="text-xs transition group-open:rotate-180">▼</span>
                                                </summary>
                                                <p class="mt-3 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                                                    ${item.a}
                                                </p>
                                            </details>
                                        `).join('')}
                                    </div>
                                </section>` : ''}

                                ${currentLake.warnings && currentLake.warnings.length > 0 ? `
                                <section class="bg-red-50 dark:bg-red-950/30 border-l-4 border-red-500 p-6 rounded-2xl">
                                    <h2 class="text-xl font-bold mb-3 text-red-700 dark:text-red-400 flex items-center gap-2">⚠️ Points de Vigilance</h2>
                                    <ul class="list-disc pl-5 space-y-2 text-sm text-red-900 dark:text-red-200">
                                        ${currentLake.warnings.map(w => `<li>${w}</li>`).join('')}
                                    </ul>
                                </section>` : ''}
                            </div>

                            <div class="space-y-6 self-start">
                                <div class="quick-info-panel bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm space-y-6">
                                    <h3 class="font-bold text-lg border-b pb-2">ℹ️ Infos Rapides</h3>
                                    <div class="space-y-3 text-sm">
                                        <div class="flex justify-between pb-2 border-b border-slate-100 dark:border-slate-700">
                                            <span class="text-slate-500">Niveau requis:</span>
                                            <span class="font-bold uppercase text-xs px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700">${currentLake.difficulty || 'Tout niveau'}</span>
                                        </div>
                                        <div class="flex justify-between pb-2 border-b border-slate-100 dark:border-slate-700">
                                            <span class="text-slate-500">Tarif d'entrée:</span>
                                            <span class="font-bold text-green-600 dark:text-green-400">${currentLake.isFree ? 'Gratuit' : 'Payant'}</span>
                                        </div>
                                        <div class="flex justify-between pb-2 border-b border-slate-100 dark:border-slate-700">
                                            <span class="text-slate-500">Qualité de l'eau:</span>
                                            <span class="font-bold text-blue-500">${currentLake.waterQuality || 'Excellente'}</span>
                                        </div>
                                        <div class="flex justify-between pb-2 border-b border-slate-100 dark:border-slate-700">
                                            <span class="text-slate-500">Longueur max:</span>
                                            <span class="font-bold">${currentLake.maxLength || 'N/A'}</span>
                                        </div>
                                    </div>

                                    ${currentLake.amenities ? `
                                    <div>
                                        <h4 class="font-semibold text-xs uppercase tracking-wider text-slate-400 mb-2">Aménagements</h4>
                                        <ul class="text-xs space-y-1.5 grid grid-cols-2 gap-1 text-slate-600 dark:text-slate-300">
                                            ${currentLake.amenities.map(a => `<li>✅ ${a}</li>`).join('')}
                                        </ul>
                                    </div>` : ''}

                                    <div class="space-y-2 pt-2">
                                        <button onclick="window.open('${directionsUrl}', '_blank')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition flex justify-center items-center gap-2">
                                            📍 Me diriger ici
                                        </button>
                                        <button onclick="sharePage()" class="w-full bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-bold py-3 px-4 rounded-xl transition flex justify-center items-center gap-2">
                                            📤 Partager le spot
                                        </button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                `;

                document.getElementById('lakeContainer').innerHTML = html;
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.style.display = 'none';

                // La météo ne bloque plus l'affichage de la fiche.
                void loadLakeWeather(currentLake);

                // Laisser le navigateur peindre le contenu avant d'initialiser la carte.
                requestAnimationFrame(() => {
                    initMap(currentLake);
                    if (typeof getNearestLakes === 'function') {
                        loadNearbyLakes(currentLake);
                    }
                });
            } catch (error) {
                console.error('❌ Erreur lors du rendu final:', error);
                showErrorMessage("Erreur d'affichage", error.message);
            }
        }

        // ========== FONCTIONS CARTES & MODALES ==========
        let detailMap = null;
        let detailStreetLayer = null;
        let detailSatelliteLayer = null;
        let detailSatelliteLabelsLayer = null;
        let isDetailMapInteractionEnabled = true;

        function isMobileDetailMapViewport() {
            return window.matchMedia('(max-width: 767px)').matches;
        }

        function setDetailMapInteractionEnabled(enabled) {
            const mapTarget = document.getElementById('map');
            if (!detailMap || !mapTarget) return;

            const isMobile = isMobileDetailMapViewport();
            const locked = isMobile && !enabled;
            const toggle = document.getElementById('detailMapInteractionToggle');
            isDetailMapInteractionEnabled = !locked;

            ['dragging', 'touchZoom', 'doubleClickZoom'].forEach(handlerName => {
                const handler = detailMap[handlerName];
                if (!handler) return;
                if (locked) handler.disable();
                else handler.enable();
            });

            if (detailMap.scrollWheelZoom) detailMap.scrollWheelZoom.disable();
            mapTarget.classList.toggle('map-touch-locked', locked);

            if (toggle) {
                toggle.hidden = !isMobile;
                toggle.setAttribute('aria-pressed', String(!locked));
                toggle.classList.toggle('is-active', !locked);
                toggle.textContent = locked ? '🗺️ Explorer la carte' : '↕ Reprendre le défilement';
            }
        }

        function toggleDetailMapInteraction() {
            setDetailMapInteractionEnabled(!isDetailMapInteractionEnabled);
        }

        function zoomDetailMap(delta) {
            if (!detailMap) return;
            detailMap.setZoom(detailMap.getZoom() + delta);
        }

        function getStoredMapMode() {
            try {
                return localStorage.getItem('spotPaddleDetailMapMode') === 'street' ? 'street' : 'satellite';
            } catch (error) {
                return 'satellite';
            }
        }

        function updateDetailMapModeControl(mode) {
            const buttons = {
                street: document.getElementById('detailMapModeStreet'),
                satellite: document.getElementById('detailMapModeSatellite')
            };

            Object.entries(buttons).forEach(([buttonMode, button]) => {
                if (!button) return;
                const isActive = buttonMode === mode;
                button.setAttribute('aria-pressed', String(isActive));
                button.classList.toggle('bg-blue-600', isActive);
                button.classList.toggle('text-white', isActive);
                button.classList.toggle('text-slate-600', !isActive);
                button.classList.toggle('dark:text-slate-300', !isActive);
                button.classList.toggle('hover:bg-slate-100', !isActive);
                button.classList.toggle('dark:hover:bg-slate-800', !isActive);
            });
        }

        function setDetailMapMode(mode, persist = true) {
            const selectedMode = mode === 'satellite' ? 'satellite' : 'street';
            if (!detailMap || !detailStreetLayer || !detailSatelliteLayer) return;

            if (selectedMode === 'satellite') {
                if (detailMap.hasLayer(detailStreetLayer)) detailMap.removeLayer(detailStreetLayer);
                if (!detailMap.hasLayer(detailSatelliteLayer)) detailSatelliteLayer.addTo(detailMap);
                if (detailSatelliteLabelsLayer && !detailMap.hasLayer(detailSatelliteLabelsLayer)) {
                    detailSatelliteLabelsLayer.addTo(detailMap);
                }
            } else {
                if (detailMap.hasLayer(detailSatelliteLayer)) detailMap.removeLayer(detailSatelliteLayer);
                if (detailSatelliteLabelsLayer && detailMap.hasLayer(detailSatelliteLabelsLayer)) {
                    detailMap.removeLayer(detailSatelliteLabelsLayer);
                }
                if (!detailMap.hasLayer(detailStreetLayer)) detailStreetLayer.addTo(detailMap);
            }

            updateDetailMapModeControl(selectedMode);

            if (persist) {
                try {
                    localStorage.setItem('spotPaddleDetailMapMode', selectedMode);
                } catch (error) {
                    // La carte reste fonctionnelle même si le stockage local est désactivé.
                }
            }
        }

        function initMap(lake) {
            const mapTarget = document.getElementById('map');
            const accessPoint = typeof getLakeAccessPoint === 'function'
                ? getLakeAccessPoint(lake)
                : { lat: lake.lat, lon: lake.lon, name: lake.name };
            const parkingPoint = typeof getLakeParkingPoint === 'function'
                ? getLakeParkingPoint(lake)
                : null;
            const directionsPoint = typeof getLakeDirectionsPoint === 'function'
                ? getLakeDirectionsPoint(lake)
                : (parkingPoint || accessPoint);

            if (!mapTarget) return;

            if (typeof L === 'undefined') {
                const mapModeControl = document.getElementById('detailMapModeControl');
                const mapZoomControl = document.getElementById('detailMapZoomControl');
                if (mapModeControl) mapModeControl.classList.add('hidden');
                if (mapZoomControl) mapZoomControl.classList.add('hidden');
                mapTarget.innerHTML = `
                    <div class="h-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-center p-6">
                        <div>
                            <div class="text-3xl mb-3">🗺️</div>
                            <p class="font-bold text-slate-800 dark:text-white">Carte temporairement indisponible</p>
                            <p class="text-sm text-slate-500 dark:text-slate-300 mt-2">${directionsPoint.name || lake.name}</p>
                            <a href="${typeof getLakeDirectionsUrl === 'function' ? getLakeDirectionsUrl(lake) : `https://www.google.com/maps/dir/?api=1&destination=${directionsPoint.lat},${directionsPoint.lon}`}" target="_blank" rel="noopener" class="inline-block mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full text-xs font-bold uppercase">Ouvrir l'itinéraire</a>
                        </div>
                    </div>
                `;
                return;
            }

            try {
                detailMap = L.map('map', { scrollWheelZoom: false, zoomControl: false }).setView([directionsPoint.lat, directionsPoint.lon], 15);
                detailMap.createPane('detailSatelliteLabelsPane');
                detailMap.getPane('detailSatelliteLabelsPane').style.zIndex = 350;
                detailMap.getPane('detailSatelliteLabelsPane').style.pointerEvents = 'none';

                detailStreetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 19
                });
                detailSatelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Source: Esri, Vantor, Earthstar Geographics, and the GIS User Community',
                    maxZoom: 23
                });
                detailSatelliteLabelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                    pane: 'detailSatelliteLabelsPane',
                    subdomains: 'abcd',
                    maxNativeZoom: 20,
                    maxZoom: 23
                });
                setDetailMapMode(getStoredMapMode(), false);
                setDetailMapInteractionEnabled(!isMobileDetailMapViewport());

                L.circleMarker([accessPoint.lat, accessPoint.lon], {
                    radius: 9,
                    fillColor: '#2563eb',
                    color: '#fff',
                    weight: 3,
                    fillOpacity: 1
                }).addTo(detailMap).bindPopup(`<strong>${accessPoint.name || lake.name}</strong><br>Mise à l'eau`);

                if (parkingPoint) {
                    L.circleMarker([parkingPoint.lat, parkingPoint.lon], {
                        radius: 10,
                        fillColor: '#16a34a',
                        color: '#fff',
                        weight: 3,
                        fillOpacity: 1
                    }).addTo(detailMap).bindPopup(`<strong>${parkingPoint.name}</strong><br>Stationnement et destination de l'itinéraire`);

                    const parkingDistance = detailMap.distance(
                        [parkingPoint.lat, parkingPoint.lon],
                        [accessPoint.lat, accessPoint.lon]
                    );

                    if (parkingDistance > 10) {
                        L.polyline([
                            [parkingPoint.lat, parkingPoint.lon],
                            [accessPoint.lat, accessPoint.lon]
                        ], {
                            color: '#0f766e',
                            weight: 3,
                            opacity: 0.8,
                            dashArray: '7 7'
                        }).addTo(detailMap);

                        detailMap.fitBounds([
                            [parkingPoint.lat, parkingPoint.lon],
                            [accessPoint.lat, accessPoint.lon]
                        ], { padding: [60, 60], maxZoom: 17 });
                    } else {
                        detailMap.setView([accessPoint.lat, accessPoint.lon], 17);
                    }
                } else {
                    detailMap.setView([accessPoint.lat, accessPoint.lon], 15);
                }
            } catch(e) {
                console.warn("Erreur d'initialisation de la carte Leaflet:", e.message);
                mapTarget.innerHTML = `
                    <div class="h-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-center p-6">
                        <div>
                            <div class="text-3xl mb-3">🗺️</div>
                            <p class="font-bold text-slate-800 dark:text-white">Carte non chargée</p>
                            <p class="text-sm text-slate-500 dark:text-slate-300 mt-2">Le point d'accès et l'itinéraire restent disponibles dans la fiche.</p>
                        </div>
                    </div>
                `;
            }
        }

        let currentGallery = [];
        let currentImgIdx = 0;

        function openPhotoModal(index, total, galleryArray) {
            currentGallery = galleryArray || window.currentLakeGallery || [];
            currentImgIdx = index;
            
            const modal = document.getElementById('photoModal');
            const img = document.getElementById('modalImage');
            
            img.src = currentGallery[currentImgIdx];
            document.getElementById('photoCount').textContent = `${currentImgIdx + 1}/${total}`;
            modal.classList.remove('hidden');
            
            document.onkeydown = (e) => {
                if (e.key === 'ArrowRight') {
                    currentImgIdx = (currentImgIdx + 1) % total;
                    img.src = currentGallery[currentImgIdx];
                    document.getElementById('photoCount').textContent = `${currentImgIdx + 1}/${total}`;
                } else if (e.key === 'ArrowLeft') {
                    currentImgIdx = (currentImgIdx - 1 + total) % total;
                    img.src = currentGallery[currentImgIdx];
                    document.getElementById('photoCount').textContent = `${currentImgIdx + 1}/${total}`;
                } else if (e.key === 'Escape') {
                    closePhotoModal();
                }
            };
        }

        function closePhotoModal() {
            document.getElementById('photoModal').classList.add('hidden');
            document.onkeydown = null;
        }

        function loadNearbyLakes(currentLake) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    try {
                        const nearbyLakes = getNearestLakes(position.coords.latitude, position.coords.longitude);
                        const filtered = nearbyLakes.filter(l => l.slug !== currentLake.slug).slice(0, 2);
                        
                        if (filtered.length > 0) {
                            const html = filtered.map(lac => `
                                <a href="?lake=${lac.slug}&v=20260709-1" class="block bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700 hover:border-blue-500 transition">
                                    <div class="font-bold text-xs text-slate-800 dark:text-white">${lac.name}</div>
                                    <div class="text-[11px] text-slate-500 dark:text-slate-400">À environ ${(lac.distance || 0).toFixed(1)} km</div>
                                </a>
                            `).join('');
                            document.getElementById('nearbyLakesList').innerHTML = html;
                            document.getElementById('nearbyLakesCount').textContent = filtered.length;
                            document.getElementById('nearbyLakesSection').classList.remove('hidden');

                            let shouldExpand = true;
                            try {
                                shouldExpand = sessionStorage.getItem('nearbyLakesExpanded') !== 'false';
                            } catch (err) {
                                // Le stockage peut être désactivé sans bloquer le widget.
                            }
                            setNearbyLakesExpanded(shouldExpand);
                        }
                    } catch(err) {
                        console.log("Calcul des lacs proches ignoré (fonctions manquantes dans data.js)");
                    }
                }, () => console.log("Géolocalisation refusée par l'usager."));
            }
        }

        function setNearbyLakesExpanded(expanded) {
            const panel = document.getElementById('nearbyLakesPanel');
            const bubble = document.getElementById('nearbyLakesBubble');
            if (!panel || !bubble) return;

            panel.classList.toggle('hidden', !expanded);
            bubble.classList.toggle('hidden', expanded);
            bubble.classList.toggle('flex', !expanded);
            bubble.setAttribute('aria-expanded', String(expanded));

            try {
                sessionStorage.setItem('nearbyLakesExpanded', String(expanded));
            } catch (err) {
                // Le stockage peut être désactivé sans bloquer le widget.
            }
        }

        function shareLocation(lat, lon) {
            window.open(`https://www.google.com/maps?q=${lat},${lon}`, '_blank');
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Lien magique copié dans le presse-papier ! Vous pouvez l'envoyer.");
            }
        }

        // Filet de sécurité : ne jamais laisser le voile bloquer toute la page.
        setTimeout(() => {
            const loadingEl = document.getElementById('loading');
            if (loadingEl && loadingEl.style.display !== 'none') {
                loadingEl.style.display = 'none';
            }
        }, 3000);
    </script>
</body>
</html>
