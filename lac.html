            <span aria-hidden="true">🗺️</span>
            <span id="nearbyLakesCount" class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-emerald-500 px-1 text-[11px] font-bold text-white ring-2 ring-white dark:ring-slate-900">2</span>

    <script src="assets/data.min.js?v=20260904-1"></script>
    <script id="lakeStructuredData" type="application/ld+json"></script>
    <script>
        // ========== GESTION DU THÈME ==========
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        const SITE_ORIGIN = 'https://spotpaddle.ca';
        const FALLBACK_SOCIAL_IMAGE = `${SITE_ORIGIN}/assets/spotpaddle-social.jpg`;
        const HYDROMETRIC_STATIONS = {
            'lac-matapedia-baie-de-charlie': '01BD004',
            'lac-matapedia-sayabec': '01BD004',
            'riviere-bonaventure': '01BG002',
            'lac-memphremagog-magog': '02OE012',
            'riviere-mille-iles-rosemere': '02OA003',
            'riviere-mille-iles-laval': '02OA003',
            'riviere-mille-iles-saint-eustache': '02OA003',
            'verdun-parc-george-oreilly': '02OA016',
            'lac-saint-louis-chateauguay': '02OA039',
            'lac-des-piles': '02NG019'
        };

        function toAbsoluteSiteUrl(value, fallback = FALLBACK_SOCIAL_IMAGE) {
            if (!value) return fallback;

            try {
                return new URL(value, `${SITE_ORIGIN}/`).toString();
            } catch (error) {
                return fallback;
            }
        }

        function getLakeHeroImage(currentLake) {
            return currentLake?.gallery?.[0] || currentLake?.heroImage || currentLake?.mainImage || FALLBACK_SOCIAL_IMAGE;
        }

        function setMetaContent(selector, content) {
            const meta = document.querySelector(selector);
            if (meta && content) {
                meta.setAttribute('content', content);
            }
        }

        function setLakeStructuredData(currentLake, canonicalUrl, imageUrl) {
            const structuredDataEl = document.getElementById('lakeStructuredData');
            if (!structuredDataEl) return;

            const structuredData = {
                '@context': 'https://schema.org',
                '@type': 'Place',
                name: `${currentLake.name} - Spot Paddle`,
                description: currentLake.description || currentLake.longDescription || '',
                url: canonicalUrl,
                image: imageUrl,
                address: {
                    '@type': 'PostalAddress',
                    addressRegion: currentLake.region || 'Québec',
                    addressCountry: 'CA'
                },
                geo: {
                    '@type': 'GeoCoordinates',
                    latitude: currentLake.lat,
                    longitude: currentLake.lon
                },
                amenityFeature: [
                    {
                        '@type': 'LocationFeatureSpecification',
                        name: 'Paddle Score',
                        value: currentLake.paddleScore || null
                    },
                    {
                        '@type': 'LocationFeatureSpecification',
                        name: 'Acces gratuit',
                        value: currentLake.isFree === true
                    }
                ]
            };

            structuredDataEl.textContent = JSON.stringify(structuredData);
        }

        // Vérifier que data.js a chargé au chargement de la fenêtre
        window.addEventListener('load', () => {
            if (typeof lacDatabase === 'undefined') {
                console.error('ERROR: lacDatabase not loaded - data.js missing?');
                showErrorMessage('Erreur de chargement', 'Impossible de charger les données. Vérifiez que data.js existe dans le dossier.');
            }
        });

        // Fonction d'erreur globale
        function showErrorMessage(title, message) {
            document.getElementById('lakeContainer').innerHTML = `
                <div class="max-w-6xl mx-auto px-6 py-16 text-center">
                    <div class="text-6xl mb-4">⚠️</div>
                    <h1 class="text-3xl font-bold mb-2">${title}</h1>
                    <p class="text-slate-600 dark:text-slate-400 mb-6">${message}</p>
                    <a href="index.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-bold transition">Retour à l'accueil</a>
                </div>
            `;
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.style.display = 'none';
        }

        // ========== FETCH MÉTÉO AVEC RETRY ==========
        const LAKE_WEATHER_TIMEOUT_MS = 10000;
        const LAKE_WEATHER_RETRY_DELAY_MS = 4000;
        const LAKE_WEATHER_RETRY_DELAY_MAX_MS = 15000;
        const LAKE_WEATHER_DEBUG_ENABLED = (() => {
            try {
                const params = new URLSearchParams(window.location.search);
                return ['weather', 'meteo'].includes(String(params.get('debug') || '').toLowerCase());
            } catch (error) {
                return false;
            }
        })();

        function lakeWeatherDebugLog(eventName, details = {}) {
            if (!LAKE_WEATHER_DEBUG_ENABLED) return;
            console.debug('[SpotPaddle météo lac]', eventName, details);
        }

        function escapeLakeDebugText(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getLakeWeatherUrl(lat, lon) {
            const params = new URLSearchParams({ lat: String(lat), lon: String(lon) });
            return `https://meteo.spotpaddle.ca/meteo.php?${params.toString()}`;
        }

        function getHydrometricRequest(currentLake) {
            const params = new URLSearchParams();
            const station = HYDROMETRIC_STATIONS[currentLake?.slug];
            if (station) {
                params.set('station', station);
                return params;
            }

            const waterbody = String(currentLake?.name || '').replace(/\s*\([^)]*\)\s*$/, '').trim();
            if (!waterbody) return null;
            params.set('waterbody', waterbody);
            return params;
        }

        function getHydrometricTrendLabel(trend) {
            return {
                rising: { icon: '↗', label: 'En hausse', color: 'text-blue-700 dark:text-blue-300' },
                falling: { icon: '↘', label: 'En baisse', color: 'text-emerald-700 dark:text-emerald-300' },
                stable: { icon: '→', label: 'Stable', color: 'text-slate-700 dark:text-slate-300' }
            }[trend] || { icon: '•', label: 'Tendance inconnue', color: 'text-slate-500' };
        }

        function getHydrometricActivityGuidance(data) {
            if (data.station?.association === 'nearest') {
                const distance = Number.isFinite(Number(data.station.distance_km))
                    ? ` à ${Number(data.station.distance_km).toLocaleString('fr-CA')} km du spot`
                    : '';
                return {
                    title: 'Station officielle voisine — indicateur régional seulement',
                    message: `Cette station${distance} peut se trouver sur un autre plan d’eau ou bassin versant. Sa mesure ne confirme ni le niveau ni la profondeur à cette mise à l’eau.`,
                    classes: 'border-amber-300 bg-amber-50 text-amber-950 dark:border-amber-800 dark:bg-amber-950/30 dark:text-amber-100'
                };
            }

            if (data.data_type === 'historical') {
                return {
                    title: 'Impossible d’évaluer les conditions actuelles',
                    message: 'La dernière donnée est historique. Ne l’utilisez pas pour décider si la profondeur est suffisante aujourd’hui.',
                    classes: 'border-amber-300 bg-amber-50 text-amber-950 dark:border-amber-800 dark:bg-amber-950/30 dark:text-amber-100'
                };
            }

            if (data.measurement.trend === 'falling') {
                return {
                    title: 'Niveau en baisse',
                    message: 'Les bordures, plages et mises à l’eau peuvent devenir moins profondes. Vérifiez visuellement les conditions avant d’entrer sur l’eau.',
                    classes: 'border-amber-300 bg-amber-50 text-amber-950 dark:border-amber-800 dark:bg-amber-950/30 dark:text-amber-100'
                };
            }

            if (data.measurement.trend === 'rising') {
                return {
                    title: 'Niveau en hausse',
                    message: 'La profondeur augmente possiblement près des accès, mais le courant et les débris peuvent aussi augmenter. Vérifiez les conditions sur place.',
                    classes: 'border-blue-300 bg-blue-50 text-blue-950 dark:border-blue-800 dark:bg-blue-950/30 dark:text-blue-100'
                };
            }

            return {
                title: 'Niveau relativement stable',
                message: 'Aucun changement important n’est détecté récemment. Cela ne confirme toutefois pas la profondeur au point exact de mise à l’eau.',
                classes: 'border-emerald-300 bg-emerald-50 text-emerald-950 dark:border-emerald-800 dark:bg-emerald-950/30 dark:text-emerald-100'
            };
        }

        function formatHydrometricObservationTime(value) {
            if (/^\d{4}-\d{2}-\d{2}$/.test(String(value))) {
                const [year, month, day] = String(value).split('-');
                return `${year}-${month}-${day}`;
            }

            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'Heure non disponible';

            return new Intl.DateTimeFormat('fr-CA', {
                dateStyle: 'medium',
                timeStyle: 'short',
                timeZone: 'America/Toronto'
            }).format(date);
        }

        function setHydrometricUnavailable(message) {
            const section = document.getElementById('hydrometricSection');
            const status = document.getElementById('hydrometricStatus');
            const content = document.getElementById('hydrometricContent');
            if (section) section.classList.add('hidden');
            if (status) {
                status.className = 'rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm font-semibold text-slate-600 dark:border-slate-700 dark:bg-slate-900/40 dark:text-slate-300';
                status.textContent = message;
            }
            if (content) content.classList.add('hidden');
        }

        async function loadLakeHydrometry(currentLake) {
            const requestParams = getHydrometricRequest(currentLake);
            if (!requestParams) {
                setHydrometricUnavailable('Le nom du plan d’eau est indisponible; aucune station officielle ne peut être recherchée.');
                return;
            }

            try {
                const response = await fetch(`https://meteo.spotpaddle.ca/hydro.php?${requestParams.toString()}`, {
                    headers: { Accept: 'application/json' }
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    const error = new Error(data.error || 'Service hydrométrique indisponible.');
                    error.status = response.status;
                    throw error;
                }

                if (!data.available || !data.measurement) {
                    setHydrometricUnavailable(data.reason || 'Aucune mesure récente transmise par cette station.');
                    return;
                }

                const section = document.getElementById('hydrometricSection');
                const status = document.getElementById('hydrometricStatus');
                const content = document.getElementById('hydrometricContent');
                const levelEl = document.getElementById('hydrometricLevel');
                const dischargeEl = document.getElementById('hydrometricDischarge');
                const trendEl = document.getElementById('hydrometricTrend');
                const stationEl = document.getElementById('hydrometricStation');
                const observedEl = document.getElementById('hydrometricObservedAt');
                const sourceEl = document.getElementById('hydrometricSource');
                const badgeEl = document.getElementById('hydrometricBadge');
                const noticeEl = document.getElementById('hydrometricDataNotice');
                const guidanceEl = document.getElementById('hydrometricGuidance');
                const trend = getHydrometricTrendLabel(data.measurement.trend);
                const guidance = getHydrometricActivityGuidance(data);
                const isHistorical = data.data_type === 'historical';
                const isNearbyStation = data.station?.association === 'nearest';
                const stationDistance = Number.isFinite(Number(data.station?.distance_km))
                    ? Number(data.station.distance_km).toLocaleString('fr-CA')
                    : null;

                if (section) section.classList.remove('hidden');
                if (status) status.classList.add('hidden');
                if (content) content.classList.remove('hidden');
                if (levelEl) levelEl.textContent = Number.isFinite(data.measurement.level) ? `${data.measurement.level.toFixed(3)} m` : 'Non mesuré';
                if (dischargeEl) dischargeEl.textContent = Number.isFinite(data.measurement.discharge) ? `${data.measurement.discharge.toFixed(1)} m³/s` : 'Non mesuré';
                if (trendEl) {
                    trendEl.textContent = `${trend.icon} ${trend.label}`;
                    trendEl.className = `text-xl font-black ${trend.color}`;
                }
                if (stationEl) stationEl.textContent = `${data.station.name} (${data.station.number})${isNearbyStation && stationDistance ? ` — ${stationDistance} km du spot` : ''}`;
                if (observedEl) observedEl.textContent = `${isHistorical ? 'Dernière donnée disponible' : 'Dernière mesure'} : ${formatHydrometricObservationTime(data.measurement.observed_at)}`;
                if (sourceEl) sourceEl.href = data.source_url;
                if (badgeEl) {
                    badgeEl.textContent = isNearbyStation ? 'Station voisine' : (isHistorical ? 'Donnée historique' : 'Dernière mesure officielle');
                    badgeEl.className = isNearbyStation || isHistorical
                        ? 'rounded-full bg-amber-100 px-3 py-1 text-[10px] font-black uppercase tracking-wider text-amber-800 dark:bg-amber-950/50 dark:text-amber-300'
                        : 'rounded-full bg-sky-100 px-3 py-1 text-[10px] font-black uppercase tracking-wider text-sky-800 dark:bg-sky-950/50 dark:text-sky-300';
                }
                if (noticeEl) {
                    noticeEl.textContent = isNearbyStation
                        ? 'Mesure provisoire d’une station officielle voisine. Elle sert uniquement d’indicateur régional et ne représente pas nécessairement ce plan d’eau.'
                        : isHistorical
                        ? 'Cette station ne transmet plus de mesure récente. Valeur affichée à titre historique seulement.'
                        : 'Mesures provisoires en temps quasi réel. Elles ne remplacent pas l’observation des conditions sur place.';
                }
                if (guidanceEl) {
                    guidanceEl.className = `mt-4 rounded-xl border p-4 text-sm leading-relaxed ${guidance.classes}`;
                    guidanceEl.innerHTML = `<strong class="block font-black">${guidance.title}</strong><span class="mt-1 block">${guidance.message}</span>`;
                }
            } catch (error) {
                if (error?.status === 400 && /station hydrométrique non autorisée|nom du plan d’eau invalide/i.test(error.message || '')) {
                    setHydrometricUnavailable('La recherche automatique de stations n’est pas encore active sur le serveur hydrométrique. Une mise à jour du service est requise.');
                    return;
                }
                setHydrometricUnavailable('Le service hydrométrique officiel est temporairement indisponible. Réessayez plus tard.');
            }
        }

        function getLakeWeatherDebugSummary(error) {
            if (!error) return 'Aucune erreur pour le moment.';
            if (error.name === 'AbortError') return 'Timeout: le proxy météo n’a pas répondu à temps.';
            const status = error.status ? `HTTP ${error.status}` : error.name || 'Erreur';
            return `${status}: ${error.message}`;
        }

        function buildLakeWeatherDebugPanel({ attempt = 0, startedAt = null, error = null, url = '' } = {}) {
            if (!LAKE_WEATHER_DEBUG_ENABLED) return '';

            const elapsedSeconds = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;

            return `
                <details class="mt-2 w-full rounded-lg border border-slate-200 bg-white/70 p-2 text-left text-[10px] text-slate-600 dark:border-slate-700 dark:bg-slate-900/50 dark:text-slate-300">
                    <summary class="cursor-pointer font-bold">Debug météo</summary>
                    <div class="mt-2 space-y-1">
                        <div><strong>Tentative:</strong> ${attempt + 1}</div>
                        <div><strong>Écoulé:</strong> ${elapsedSeconds}s</div>
                        <div><strong>Dernier état:</strong> ${escapeLakeDebugText(getLakeWeatherDebugSummary(error))}</div>
                        ${url ? `<div class="break-all"><strong>URL:</strong> ${escapeLakeDebugText(url)}</div>` : ''}
                    </div>
                </details>
            `;
        }

        function waitForLakeWeatherRetry(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function getLakeWeatherRetryDelayMs(attempt) {
            return Math.min(LAKE_WEATHER_RETRY_DELAY_MS + (attempt * 2000), LAKE_WEATHER_RETRY_DELAY_MAX_MS);
        }

        async function fetchWeatherForLake(lat, lon) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), LAKE_WEATHER_TIMEOUT_MS);
            const startedAt = Date.now();
            const url = getLakeWeatherUrl(lat, lon);

            lakeWeatherDebugLog('fetch:start', { url, lat, lon, timeoutMs: LAKE_WEATHER_TIMEOUT_MS });

            try {
                const response = await fetch(url, {
                    signal: controller.signal,
                    cache: 'default'
                });

                lakeWeatherDebugLog('fetch:response', {
                    url,
                    status: response.status,
                    ok: response.ok,
                    durationMs: Date.now() - startedAt,
                    cache: response.headers.get('x-spotpaddle-cache'),
                    rateRemaining: response.headers.get('x-ratelimit-remaining')
                });
                
                if (!response.ok) {
                    const error = new Error('API status: ' + response.status);
                    error.status = response.status;
                    throw error;
                }
                
                const data = await response.json();
                if (!data?.main || !data?.wind || !data?.clouds) {
                    throw new Error('Réponse météo incomplète');
                }
                lakeWeatherDebugLog('fetch:success', {
                    url,
                    city: data.name,
                    code: data.cod,
                    durationMs: Date.now() - startedAt
                });
                const windKmh = data.wind.speed * 3.6;
                return {
                    available: true,
                    temp: data.main.temp,
                    wind: windKmh, // m/s à km/h
                    clouds: data.clouds.all,
                    waterState: getLakeWaterState(windKmh)
                };
            } catch (error) {
                lakeWeatherDebugLog('fetch:error', {
                    url,
                    message: error.message,
                    name: error.name,
                    status: error.status || null,
                    durationMs: Date.now() - startedAt
                });
                throw error;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function formatLakeWeather(value, digits, suffix) {
            return Number.isFinite(value) ? `${value.toFixed(digits)}${suffix}` : 'Indisponible';
        }

        // État qualitatif inspiré de l'échelle de Beaufort. Une vitesse de vent
        // seule ne permet pas de calculer une hauteur de vague fiable sur un lac.
        function getLakeWaterState(windKmh) {
            if (!Number.isFinite(windKmh)) return 'Indisponible';
            if (windKmh < 1) return 'Calme';
            if (windKmh < 6) return 'Rides légères';
            if (windKmh < 12) return 'Vaguelettes';
            if (windKmh < 20) return 'Très petites vagues';
            if (windKmh < 29) return 'Petites vagues';
            if (windKmh < 39) return 'Agité · moutons';
            return 'Très agité';
        }

        function updateLakeWeatherWidget(weatherData) {
            const status = document.getElementById('lakeWeatherStatus');
            const temperature = document.getElementById('lakeWeatherTemp');
            const wind = document.getElementById('lakeWeatherWind');
            const clouds = document.getElementById('lakeWeatherClouds');
            const waves = document.getElementById('lakeWeatherWaves');

            if (!status || !temperature || !wind || !clouds || !waves) return;

            if (weatherData.available) {
                status.className = 'mb-4 rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-sm font-semibold text-emerald-800 dark:border-emerald-900/50 dark:bg-emerald-950/30 dark:text-emerald-200';
                status.textContent = 'Conditions météo mises à jour.';

            temperature.textContent = formatLakeWeather(weatherData.temp, 1, '°C');
            wind.textContent = formatLakeWeather(weatherData.wind, 1, ' km/h');
            clouds.textContent = formatLakeWeather(weatherData.clouds, 0, '%');
            waves.textContent = weatherData.waterState || 'Indisponible';

        function updateLakeWeatherLoading(attempt = 0, debugState = {}) {
            const status = document.getElementById('lakeWeatherStatus');
            const temperature = document.getElementById('lakeWeatherTemp');
            const wind = document.getElementById('lakeWeatherWind');
            const clouds = document.getElementById('lakeWeatherClouds');
            const waves = document.getElementById('lakeWeatherWaves');

            if (!status || !temperature || !wind || !clouds || !waves) return;

            status.className = 'mb-4 rounded-xl border border-blue-200 bg-blue-50 p-3 text-sm font-semibold text-blue-800 dark:border-blue-900/50 dark:bg-blue-950/30 dark:text-blue-200';

            wind.textContent = '—';
            clouds.textContent = '—';
            waves.textContent = 'Chargement…';

        async function loadLakeWeather(currentLake) {
            let retryAttempt = 0;
            const requestStartedAt = Date.now();
            const weatherUrl = getLakeWeatherUrl(currentLake.lat, currentLake.lon);

            lakeWeatherDebugLog('widget:start', {
                lake: currentLake.name,
                lat: currentLake.lat,
                lon: currentLake.lon,
                url: weatherUrl
            });

            updateLakeWeatherLoading(retryAttempt, {
                startedAt: requestStartedAt,
                url: weatherUrl
            });

            while (document.getElementById('lakeWeatherStatus')) {
                try {
                    const weatherData = await fetchWeatherForLake(currentLake.lat, currentLake.lon);
                    updateLakeWeatherWidget(weatherData);
                    lakeWeatherDebugLog('widget:weather-ready', {
                        lake: currentLake.name,
                        attempts: retryAttempt + 1,
                        elapsedMs: Date.now() - requestStartedAt
                    });
                    return;
                } catch (error) {
                    retryAttempt += 1;
                    lakeWeatherDebugLog('widget:retry', {
                        lake: currentLake.name,
                        retryAttempt,
                        nextRetryMs: getLakeWeatherRetryDelayMs(retryAttempt),
                        error: getLakeWeatherDebugSummary(error)
                    });
                    updateLakeWeatherLoading(retryAttempt, {
                        startedAt: requestStartedAt,
                        error,
                        url: weatherUrl
                    });
                    await waitForLakeWeatherRetry(getLakeWeatherRetryDelayMs(retryAttempt));
                }
            }
        }

        function loadDetailMapStylesheet() {
            if (document.querySelector('link[data-detail-leaflet-css]')) {
                return Promise.resolve();
            }

            return new Promise(resolve => {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = `assets/vendor/leaflet/leaflet.css?v=${DETAIL_MAP_ASSET_VERSION}`;
                link.dataset.detailLeafletCss = 'true';
                link.onload = resolve;
                link.onerror = () => {
                    console.warn('Feuille Leaflet indisponible.');
                    resolve();
                };
                document.head.appendChild(link);
            });
        }

        function loadDetailMapScript() {
            if (typeof L !== 'undefined') {
                return Promise.resolve();
            }

            const existingScript = document.querySelector('script[data-detail-leaflet-js]');
            if (existingScript) {
                return new Promise((resolve, reject) => {
                    existingScript.addEventListener('load', resolve, { once: true });
                    existingScript.addEventListener('error', () => reject(new Error('Script Leaflet indisponible')), { once: true });
                });
            }

            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = `assets/vendor/leaflet/leaflet.js?v=${DETAIL_MAP_ASSET_VERSION}`;
                script.async = true;
                script.dataset.detailLeafletJs = 'true';
                script.onload = resolve;
                script.onerror = () => reject(new Error('Script Leaflet indisponible'));
                document.body.appendChild(script);
            });
        }

        function loadDetailMapAssets() {
            if (!detailMapAssetsPromise) {
                detailMapAssetsPromise = Promise.all([
                    loadDetailMapStylesheet(),
                    loadDetailMapScript()
                ]).then(() => undefined);
            }

            return detailMapAssetsPromise;
        }

        function startDetailMapInit(currentLake) {
            if (detailMapInitStarted) return;
            detailMapInitStarted = true;

            loadDetailMapAssets()
                .then(() => initMap(currentLake))
                .catch(error => {
                    console.warn('Carte Leaflet non chargee:', error.message);
                    initMap(currentLake);
                });

        function scheduleDetailMapInit(currentLake) {
            const mapTarget = document.getElementById('map');
            if (!mapTarget) return;

            mapTarget.addEventListener('pointerenter', () => startDetailMapInit(currentLake), { once: true });
            mapTarget.addEventListener('touchstart', () => startDetailMapInit(currentLake), { once: true, passive: true });

            if (!('IntersectionObserver' in window)) {
                if ('requestIdleCallback' in window) {
                    window.requestIdleCallback(() => startDetailMapInit(currentLake), { timeout: 2500 });
                } else {
                    window.setTimeout(() => startDetailMapInit(currentLake), 1200);
                }
                return;
            }

            const observer = new IntersectionObserver(entries => {
                if (!entries.some(entry => entry.isIntersecting)) return;
                observer.disconnect();
                startDetailMapInit(currentLake);
            }, { rootMargin: '360px 0px' });

            observer.observe(mapTarget);
        }

                                                </div>
                                                <div class="rounded-xl bg-white p-4 text-center shadow-sm dark:bg-slate-900/60">
                                                    <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Débit</p>
                                                    <p id="hydrometricDischarge" class="mt-2 text-xl font-black text-sky-700 dark:text-sky-300">—</p>
                                                </div>
                                                <div class="rounded-xl bg-white p-4 text-center shadow-sm dark:bg-slate-900/60">
                                                    <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Tendance</p>
                                                    <p id="hydrometricTrend" class="mt-2 text-xl font-black text-slate-700 dark:text-slate-300">—</p>
                                                </div>
                                            </div>
                                            <div id="hydrometricGuidance" class="mt-4 rounded-xl border border-slate-200 bg-white/70 p-4 text-sm leading-relaxed text-slate-700 dark:border-slate-700 dark:bg-slate-900/40 dark:text-slate-200"></div>
                                            <div class="mt-4 text-xs leading-relaxed text-slate-600 dark:text-slate-300">
                                                <p id="hydrometricStation" class="font-bold"></p>
                                                <p id="hydrometricObservedAt" class="mt-1"></p>
                                                <p id="hydrometricDataNotice" class="mt-2">Mesures provisoires en temps quasi réel. Elles ne remplacent pas l’observation des conditions sur place.</p>
                                                <p class="mt-2 font-semibold">La profondeur dépend du point exact, de la pente et de la bathymétrie locale. Spot Paddle ne possède pas encore ces mesures pour chaque accès.</p>
                                                <a id="hydrometricSource" href="https://eau.ec.gc.ca/" target="_blank" rel="noopener" class="mt-3 inline-flex font-black text-sky-700 underline hover:text-sky-900 dark:text-sky-300">Voir la station officielle</a>
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                ${publicFaq.length > 0 ? `
                                <section>
                                    <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">❓ Questions Fréquentes</h2>
                                    <div class="space-y-3">
                                        ${publicFaq.map(item => `
                                            <details class="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl group border border-slate-200 dark:border-slate-700">
                                                <summary class="font-bold cursor-pointer flex justify-between items-center text-sm md:text-base">
                                                    ${item.q}
                                                    <span class="text-xs transition group-open:rotate-180">▼</span>
                                                </summary>
                                                <p class="mt-3 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                                                    ${item.a}
                                                </p>
                                            </details>
                                        `).join('')}
                                    </div>
                                </section>` : ''}

                                ${currentLake.warnings && currentLake.warnings.length > 0 ? `
                                <section class="bg-red-50 dark:bg-red-950/30 border-l-4 border-red-500 p-6 rounded-2xl">
                                    <h2 class="text-xl font-bold mb-3 text-red-700 dark:text-red-400 flex items-center gap-2">⚠️ Points de Vigilance</h2>
                                    <ul class="list-disc pl-5 space-y-2 text-sm text-red-900 dark:text-red-200">
                                        ${currentLake.warnings.map(w => `<li>${w}</li>`).join('')}
                                    </ul>
                                </section>` : ''}
                            </div>

                            <div class="quick-info-column self-start">
                                <div class="quick-info-panel bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 shadow-sm space-y-4 sm:p-5">
                                    <h3 class="font-bold text-lg border-b pb-2">ℹ️ Infos Rapides</h3>
                                    <div class="space-y-2 text-sm">
                                        <div class="flex justify-between pb-2 border-b border-slate-100 dark:border-slate-700">
                                            <span class="text-slate-500">Niveau requis:</span>
                                            <span class="font-bold uppercase text-xs px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700">${currentLake.difficulty || 'Tout niveau'}</span>
                                        </div>
                                        <div class="flex justify-between pb-2 border-b border-slate-100 dark:border-slate-700">
                                            <span class="text-slate-500">Tarif d'entrée:</span>
                                            <span class="font-bold ${currentLake.isFree === true ? 'text-green-600 dark:text-green-400' : currentLake.isFree === false ? 'text-amber-600 dark:text-amber-400' : 'text-slate-600 dark:text-slate-300'}">${currentLake.isFree === true ? 'Gratuit' : currentLake.isFree === false ? 'Payant' : 'À vérifier'}</span>
                                        </div>
                                        <div class="flex justify-between pb-2 border-b border-slate-100 dark:border-slate-700">
                                            <span class="text-slate-500">Qualité de l'eau:</span>
                                            <span class="font-bold text-blue-500">${currentLake.waterQuality || 'Excellente'}</span>
                                        </div>
                                        <div class="flex justify-between pb-2 border-b border-slate-100 dark:border-slate-700">
                                            <span class="text-slate-500">Longueur max:</span>
                                            <span class="font-bold">${currentLake.maxLength || 'N/A'}</span>
                                        </div>
                                    </div>

                                    ${publicAmenities.length ? `
                                    <div>
                                        <h4 class="font-semibold text-xs uppercase tracking-wider text-slate-400 mb-1.5">Aménagements</h4>
                                        <ul class="text-xs grid grid-cols-2 gap-x-3 gap-y-1.5 text-slate-600 dark:text-slate-300">
                                            ${publicAmenities.map(a => `<li>✅ ${a}</li>`).join('')}
                                        </ul>
                                    </div>` : ''}

                                    <div class="space-y-1.5">
                                        <button onclick="window.open('${directionsUrl}', '_blank')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md hover:shadow-lg transition flex justify-center items-center gap-2">
                                            📍 Me diriger ici
                                        </button>
                                        <button onclick="sharePage()" class="w-full bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-bold py-2.5 px-4 rounded-xl transition flex justify-center items-center gap-2">
                                            📤 Partager le spot
                                        </button>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <section class="mt-12 overflow-hidden rounded-3xl border border-amber-200 bg-gradient-to-br from-amber-50 to-orange-100 p-6 shadow-lg dark:border-amber-800/60 dark:from-amber-950/40 dark:to-orange-950/30 md:flex md:items-center md:justify-between md:gap-8 md:p-8">
                            <div>
                                <p class="text-xs font-black uppercase tracking-[0.18em] text-amber-700 dark:text-amber-300">Communauté Spot Paddle</p>
                                <h2 class="mt-2 text-2xl font-black text-slate-950 dark:text-white">Vous avez une photo de ce spot?</h2>
                                <p class="mt-2 max-w-2xl text-sm leading-relaxed text-slate-700 dark:text-slate-300">
                                    Partagez une vue de l’eau, de la mise à l’eau ou du stationnement. Le spot est déjà sélectionné et le formulaire prend seulement quelques secondes.
                                </p>
                            </div>
                            <a href="${photoContributionUrl}" class="mt-5 inline-flex w-full shrink-0 items-center justify-center gap-2 rounded-2xl bg-amber-500 px-6 py-4 text-sm font-black uppercase tracking-wide text-slate-950 shadow-lg shadow-amber-500/25 transition hover:bg-amber-600 active:scale-95 md:mt-0 md:w-auto">
                                📷 Partager une photo
                            </a>
                        </section>
                    </div>
                `;

                document.getElementById('lakeContainer').innerHTML = html;
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.style.display = 'none';

                // La météo ne bloque plus l'affichage de la fiche.
                void loadLakeWeather(currentLake);
                void loadLakeHydrometry(currentLake);

                // Laisser le navigateur peindre le contenu avant de preparer la carte.
                requestAnimationFrame(() => {
                    scheduleDetailMapInit(currentLake);
                    if (typeof getNearestLakes === 'function') {
                        loadNearbyLakes(currentLake);
                    }
                });
            } catch (error) {
                console.error('❌ Erreur lors du rendu final:', error);
                showErrorMessage("Erreur d'affichage", error.message);
            }
        }

        // ========== FONCTIONS CARTES & MODALES ==========
        let detailMap = null;
        let detailStreetLayer = null;
        let detailSatelliteLayer = null;
        let detailSatelliteLabelsLayer = null;
        let isDetailMapInteractionEnabled = true;

        function isMobileDetailMapViewport() {
            return window.matchMedia('(max-width: 767px)').matches;
        }

        function setDetailMapInteractionEnabled(enabled) {
            const mapTarget = document.getElementById('map');
            if (!detailMap || !mapTarget) return;

            const isMobile = isMobileDetailMapViewport();
            const locked = isMobile && !enabled;
            const toggle = document.getElementById('detailMapInteractionToggle');
            isDetailMapInteractionEnabled = !locked;

            ['dragging', 'touchZoom', 'doubleClickZoom'].forEach(handlerName => {
                const handler = detailMap[handlerName];
                if (!handler) return;
                if (locked) handler.disable();
                else handler.enable();
            });

            if (detailMap.scrollWheelZoom) detailMap.scrollWheelZoom.disable();
            mapTarget.classList.toggle('map-touch-locked', locked);

            if (toggle) {
                toggle.hidden = !isMobile;
                toggle.setAttribute('aria-pressed', String(!locked));
                toggle.classList.toggle('is-active', !locked);
                toggle.textContent = locked ? '🗺️ Explorer la carte' : '↕ Reprendre le défilement';
            }
        }

        function toggleDetailMapInteraction() {
            setDetailMapInteractionEnabled(!isDetailMapInteractionEnabled);
        }

        function zoomDetailMap(delta) {
            if (!detailMap) return;
            detailMap.setZoom(detailMap.getZoom() + delta);
        }

        function getStoredMapMode() {
            try {
                return localStorage.getItem('spotPaddleDetailMapMode') === 'street' ? 'street' : 'satellite';
            } catch (error) {
                return 'satellite';
            }
        }

        function updateDetailMapModeControl(mode) {
            const buttons = {
                street: document.getElementById('detailMapModeStreet'),
                satellite: document.getElementById('detailMapModeSatellite')
            };

            Object.entries(buttons).forEach(([buttonMode, button]) => {
                if (!button) return;
                const isActive = buttonMode === mode;
                button.setAttribute('aria-pressed', String(isActive));
                button.classList.toggle('bg-blue-600', isActive);
                button.classList.toggle('text-white', isActive);
                button.classList.toggle('text-slate-600', !isActive);
                button.classList.toggle('dark:text-slate-300', !isActive);
                button.classList.toggle('hover:bg-slate-100', !isActive);
                button.classList.toggle('dark:hover:bg-slate-800', !isActive);
            });
        }

        function setDetailMapMode(mode, persist = true) {
            const selectedMode = mode === 'satellite' ? 'satellite' : 'street';
            if (!detailMap || !detailStreetLayer || !detailSatelliteLayer) return;

            if (selectedMode === 'satellite') {
                if (detailMap.hasLayer(detailStreetLayer)) detailMap.removeLayer(detailStreetLayer);
                if (!detailMap.hasLayer(detailSatelliteLayer)) detailSatelliteLayer.addTo(detailMap);
                if (detailSatelliteLabelsLayer && !detailMap.hasLayer(detailSatelliteLabelsLayer)) {
                    detailSatelliteLabelsLayer.addTo(detailMap);
                }
            } else {
                if (detailMap.hasLayer(detailSatelliteLayer)) detailMap.removeLayer(detailSatelliteLayer);
                if (detailSatelliteLabelsLayer && detailMap.hasLayer(detailSatelliteLabelsLayer)) {
                    detailMap.removeLayer(detailSatelliteLabelsLayer);
                }
                if (!detailMap.hasLayer(detailStreetLayer)) detailStreetLayer.addTo(detailMap);
            }

            updateDetailMapModeControl(selectedMode);

            if (persist) {
                try {
                    localStorage.setItem('spotPaddleDetailMapMode', selectedMode);
                } catch (error) {
                    // La carte reste fonctionnelle même si le stockage local est désactivé.
                }
            }
        }

        function initMap(lake) {
            const mapTarget = document.getElementById('map');
            const accessPoint = typeof getLakeAccessPoint === 'function'
                ? getLakeAccessPoint(lake)
                : { lat: lake.lat, lon: lake.lon, name: lake.name };
            const parkingPoint = typeof getLakeParkingPoint === 'function'
                ? getLakeParkingPoint(lake)
                : null;
            const washStationPoint = typeof getLakeWashStationPoint === 'function'
                ? getLakeWashStationPoint(lake)
                : lake.washStationPoint || null;
            const directionsPoint = typeof getLakeDirectionsPoint === 'function'
                ? getLakeDirectionsPoint(lake)
                : (parkingPoint || accessPoint);

            if (!mapTarget) return;

            if (typeof L === 'undefined') {
                const mapModeControl = document.getElementById('detailMapModeControl');
                const mapZoomControl = document.getElementById('detailMapZoomControl');
                if (mapModeControl) mapModeControl.classList.add('hidden');
                if (mapZoomControl) mapZoomControl.classList.add('hidden');
                mapTarget.innerHTML = `
                    <div class="h-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-center p-6">
                        <div>
                            <div class="text-3xl mb-3">🗺️</div>
                            <p class="font-bold text-slate-800 dark:text-white">Carte temporairement indisponible</p>
                            <p class="text-sm text-slate-500 dark:text-slate-300 mt-2">${directionsPoint.name || lake.name}</p>
                            <a href="${typeof getLakeDirectionsUrl === 'function' ? getLakeDirectionsUrl(lake) : `https://www.google.com/maps/dir/?api=1&destination=${directionsPoint.lat},${directionsPoint.lon}`}" target="_blank" rel="noopener" class="inline-block mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full text-xs font-bold uppercase">Ouvrir l'itinéraire</a>
                        </div>
                    </div>
                `;
                return;
            }

            try {
                detailMap = L.map('map', { scrollWheelZoom: false, zoomControl: false }).setView([directionsPoint.lat, directionsPoint.lon], 15);
                detailMap.createPane('detailSatelliteLabelsPane');
                detailMap.getPane('detailSatelliteLabelsPane').style.zIndex = 350;
                detailMap.getPane('detailSatelliteLabelsPane').style.pointerEvents = 'none';

                detailStreetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 19
                });
                detailSatelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Source: Esri, Vantor, Earthstar Geographics, and the GIS User Community',
                    maxZoom: 23
                });
                detailSatelliteLabelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                    pane: 'detailSatelliteLabelsPane',
                    subdomains: 'abcd',
                    maxNativeZoom: 20,
                    maxZoom: 23
                });
                setDetailMapMode(getStoredMapMode(), false);
                setDetailMapInteractionEnabled(!isMobileDetailMapViewport());

                L.circleMarker([accessPoint.lat, accessPoint.lon], {
                    radius: 9,
                    fillColor: '#2563eb',
                    color: '#fff',
                    weight: 3,
                    fillOpacity: 1
                }).addTo(detailMap).bindPopup(`<strong>${accessPoint.name || lake.name}</strong><br>Mise à l'eau`);

                if (parkingPoint) {
                    L.circleMarker([parkingPoint.lat, parkingPoint.lon], {
                        radius: 10,
                        fillColor: '#16a34a',
                        color: '#fff',
                        weight: 3,
                        fillOpacity: 1
                    }).addTo(detailMap).bindPopup(`<strong>${parkingPoint.name}</strong><br>Stationnement et destination de l'itinéraire`);

                    const parkingDistance = detailMap.distance(
                        [parkingPoint.lat, parkingPoint.lon],
                        [accessPoint.lat, accessPoint.lon]
                    );

                    if (parkingDistance > 10) {
                        L.polyline([
                            [parkingPoint.lat, parkingPoint.lon],
                            [accessPoint.lat, accessPoint.lon]
                        ], {
                            color: '#0f766e',
                            weight: 3,
                            opacity: 0.8,
                            dashArray: '7 7'
                        }).addTo(detailMap);

                        detailMap.fitBounds([
                            [parkingPoint.lat, parkingPoint.lon],
                            [accessPoint.lat, accessPoint.lon]
                        ], { padding: [60, 60], maxZoom: 17 });
                    } else {
                        detailMap.setView([accessPoint.lat, accessPoint.lon], 17);
                    }
                } else {
                    detailMap.setView([accessPoint.lat, accessPoint.lon], 15);
                }

                if (washStationPoint) {
                    L.circleMarker([washStationPoint.lat, washStationPoint.lon], {
                        radius: 11,
                        fillColor: '#d97706',
                        color: '#fff',
                        weight: 3,
                        fillOpacity: 1
                    }).addTo(detailMap).bindPopup(`<strong>${washStationPoint.name}</strong><br>🧼 Lavage obligatoire avant la mise à l'eau`);

                    const visiblePoints = [[accessPoint.lat, accessPoint.lon], [washStationPoint.lat, washStationPoint.lon]];
                    if (parkingPoint) visiblePoints.push([parkingPoint.lat, parkingPoint.lon]);
                    detailMap.fitBounds(visiblePoints, { padding: [60, 60], maxZoom: 17 });
                }
            } catch(e) {
                console.warn("Erreur d'initialisation de la carte Leaflet:", e.message);
                mapTarget.innerHTML = `
                    <div class="h-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-center p-6">
                        <div>
                            <div class="text-3xl mb-3">🗺️</div>
                            <p class="font-bold text-slate-800 dark:text-white">Carte non chargée</p>
                            <p class="text-sm text-slate-500 dark:text-slate-300 mt-2">Le point d'accès et l'itinéraire restent disponibles dans la fiche.</p>
                        </div>
                    </div>
                `;
            }
        }

        let currentGallery = [];
        let currentImgIdx = 0;

        function openPhotoModal(index, total, galleryArray) {
            currentGallery = galleryArray || window.currentLakeGallery || [];
            currentImgIdx = index;
            
            const modal = document.getElementById('photoModal');
            const img = document.getElementById('modalImage');
            
            img.src = currentGallery[currentImgIdx];
            document.getElementById('photoCount').textContent = `${currentImgIdx + 1}/${total}`;
            modal.classList.remove('hidden');
            
            document.onkeydown = (e) => {
                if (e.key === 'ArrowRight') {
                    currentImgIdx = (currentImgIdx + 1) % total;
                    img.src = currentGallery[currentImgIdx];
                    document.getElementById('photoCount').textContent = `${currentImgIdx + 1}/${total}`;
                } else if (e.key === 'ArrowLeft') {
                    currentImgIdx = (currentImgIdx - 1 + total) % total;
                    img.src = currentGallery[currentImgIdx];
                    document.getElementById('photoCount').textContent = `${currentImgIdx + 1}/${total}`;
                } else if (e.key === 'Escape') {
                    closePhotoModal();
                }
            };
        }

        function closePhotoModal() {
            document.getElementById('photoModal').classList.add('hidden');
            document.onkeydown = null;
        }

        function loadNearbyLakes(currentLake) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    try {
                        const nearbyLakes = getNearestLakes(position.coords.latitude, position.coords.longitude);
                        const filtered = nearbyLakes.filter(l => l.slug !== currentLake.slug).slice(0, 2);
                        
                        if (filtered.length > 0) {
                            const html = filtered.map(lac => `
                                <a href="?lake=${lac.slug}&v=20260709-1" class="block bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700 hover:border-blue-500 transition">
                                    <div class="font-bold text-xs text-slate-800 dark:text-white">${lac.name}</div>
                                    <div class="text-[11px] text-slate-500 dark:text-slate-400">À environ ${(lac.distance || 0).toFixed(1)} km</div>
                                </a>
                            `).join('');
                            document.getElementById('nearbyLakesList').innerHTML = html;
                            document.getElementById('nearbyLakesCount').textContent = filtered.length;
                            document.getElementById('nearbyLakesSection').classList.remove('hidden');

                            // Toujours présenter le widget sous sa forme réduite à l'ouverture.
                            setNearbyLakesExpanded(false);
                        }
                    } catch(err) {
                        console.log("Calcul des lacs proches ignoré (fonctions manquantes dans data.js)");
                    }
                }, () => console.log("Géolocalisation refusée par l'usager."));
            }
        }

        function setNearbyLakesExpanded(expanded) {
            const panel = document.getElementById('nearbyLakesPanel');
            const bubble = document.getElementById('nearbyLakesBubble');
            if (!panel || !bubble) return;

            panel.classList.toggle('hidden', !expanded);
            bubble.classList.toggle('hidden', expanded);
            bubble.classList.toggle('flex', !expanded);
            bubble.setAttribute('aria-expanded', String(expanded));

        }

        function shareLocation(lat, lon) {
            window.open(`https://www.google.com/maps?q=${lat},${lon}`, '_blank');
        }

        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Lien magique copié dans le presse-papier ! Vous pouvez l'envoyer.");
            }
        }

        // Filet de sécurité : ne jamais laisser le voile bloquer toute la page.
        setTimeout(() => {
            const loadingEl = document.getElementById('loading');
            if (loadingEl && loadingEl.style.display !== 'none') {
                loadingEl.style.display = 'none';
            }
        }, 3000);
    </script>
</body>
</html>
